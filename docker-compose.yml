services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: ida_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  postgres:
    image: postgres:16
    container_name: ida_postgres
    environment:
      POSTGRES_USER: ida
      POSTGRES_PASSWORD: ida_dev
      POSTGRES_DB: ida_records
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  qdrant_storage:
  pg_data: