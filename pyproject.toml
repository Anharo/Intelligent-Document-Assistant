[project]
name = "ida"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anharo", email = "anharogit@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "groq>=1.7.0",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.5",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.1",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.0.1",
]

[project.scripts]
ida = "ida:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
